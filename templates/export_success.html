<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Successful - ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<main class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <div class="hero-badge">
            Export Complete
        </div>

        <h1>
            Your Comic Is Ready!
        </h1>

        <p>
            Your AI-generated comic has been
            successfully exported.
        </p>


        {% if pdf_url %}

        <a
            href="{{ pdf_url }}"
            class="download-button"
            download
        >
            Download PDF
        </a>

        {% endif %}


        <a
            href="/"
            class="secondary-button"
        >
            Create Another Comic
        </a>

    </div>

</main>

</body>

</html>
